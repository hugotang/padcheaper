name: Build iOS LiveContainer dylib

on:
  # Accumulate features first. Dispatch only when the user requests a build/test.
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: ios-dylib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show iOS SDK toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang

      - name: Validate target and run protocol tests
        run: |
          python3 ios/tools/generate_target.py
          python3 ios/tools/generate_battle.py
          bash ios/test.sh

      - name: Compile arm64 iPhoneOS dylib
        run: bash ios/build.sh

      - name: Verify editor save and mobile interactions
        run: |
          npm install --prefix build/editor-ui-deps --no-audit --no-fund playwright@1.64.1
          node build/editor-ui-deps/node_modules/playwright/cli.js install chromium
          PH_PLAYWRIGHT_MODULE="$PWD/build/editor-ui-deps/node_modules/playwright" node ios/tests/editor_ui_tests.js

      - name: Upload editor browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-Editor-browser-${{ github.run_number }}
          path: build/editor-browser/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Inspect Mach-O and signature
        run: |
          file build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -hv build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -l build/ios/PADCheaper.dylib
          codesign --verify --strict build/ios/PADCheaper.dylib
          shasum -a 256 build/ios/PADCheaper.dylib

      - name: Upload dylib and installation notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-iOS-arm64-${{ github.run_number }}
          path: build/ios/
          if-no-files-found: error
          retention-days: 30

      - name: Verify floating GUI in iOS Simulator
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p build/ios-ui-tests
          bash ios/gui-test.sh 2>&1 | tee build/ios-ui-tests/gui-test.log

      - name: Upload GUI probe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-GUI-probe-${{ github.run_number }}
          path: |
            build/ios-ui-tests/*.png
            build/ios-ui-tests/*.json
            build/ios-ui-tests/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          metadata = json.loads(Path('build/ios/build-info.json').read_text())
          print('Built **PADCheaper.dylib** for arm64 iPhoneOS, minimum iOS 15.0.')
          print()
          print('Download the run artifact and replace the dylib through the existing Dopamine rootless injection setup. LiveContainer users must re-sign there before loading.')
          print('Version **' + metadata['dylib_version'] + '** includes a mobile team overview and member sheet, 64 saved teams, full-slot swap/copy, undo, recent cards and pinch zoom.')
          print('Formation saves require a matching native success receipt. Real disk-write failure preserves the editor draft and the previously selected automatic entry team.')
          print('0.5.13: 4P next-board readiness accepts the native retained submitted bit with all other gates intact. A second gesture always requires another explicit tap. Session/runtime readiness diagnostics retain up to 16 UI-observed multiplayer changes after exit; metadata-only release preserves the last complete board.')
          print('Multiplayer leader goals use the current native leader/helper skills, including linked fixed-team variants. Missing or unsupported skills disable the plan; a verified 4P extra-skill helper contributes no helper leader clauses. Source changes cancel stale planning/input. This checks board conditions only, not HP, skill-use count or full activation.')
          print('Explicit 3/4/8-player local once uses fresh native ownership/view/clock checks, one armed began and token-bound release. Co-op turn ownership and independent versus boards are tested separately. Multiplayer continuous mode, skills, team replacement, BGM, timer writes and packet edits remain disabled; modes 7/10/11 cannot become solo when the selector resets.')
          print('Transient skill-window closure waits at most three seconds without consuming opening/once/group progress, then rechecks before activation and first touch. Persistent restrictions and changed context still stop.')
          print('The independent CIEL x Euphyllis single-Kenpachi plan uses Unohana in slot 5, seven confirmed opening skills and mandatory 6-1-2 supply every puzzle. Unohana becomes ready at puzzle 6 under ordinary charge assumptions; Kenpachi responds only to required absorption rescue. Reimport the new template to adopt it. Existing Uryu and CIEL plans remain available.')
          print('Optional default-off diagonal movement shares one policy across search, replay and native acknowledgement. Matching remains horizontal/vertical. Profile and team-plan settings save atomically.')
          print('Retains optional normal poison with all-phase first-wave heart four, conservative thorn HP checks, opening resize, native same-family body/assist selection, team persistence and named BGM behavior. No full healing, damage or seamless-skill guarantee is made.')
          print('The exact source passed protocol/model/solver, macOS native/session/rules/config/profile, browser and Scene/legacy initial/restart GUI suites, arm64 compilation and strict ad-hoc signature verification. The artifact retains device_verified=false: real PAD skill effects, diagonal acceptance and multiplayer synchronization still require device testing.')
          print('The artifact starts in diagnostic mode; automatic entry is disabled by default. Both existing Dopamine rootless and LiveContainer loading workflows are retained.')
          print()
          print('SHA-256: `' + metadata['sha256'] + '`')
          PY
