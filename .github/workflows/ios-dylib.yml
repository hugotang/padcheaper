name: Build iOS LiveContainer dylib

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'ios/**'
      - '.github/workflows/ios-dylib.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-dylib.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: ios-dylib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show iOS SDK toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang

      - name: Validate target and run protocol tests
        run: |
          python3 ios/tools/generate_target.py
          python3 ios/tools/generate_battle.py
          bash ios/test.sh

      - name: Compile arm64 iPhoneOS dylib
        run: bash ios/build.sh

      - name: Inspect Mach-O and signature
        run: |
          file build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -hv build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -l build/ios/PADCheaper.dylib
          codesign --verify --strict build/ios/PADCheaper.dylib
          shasum -a 256 build/ios/PADCheaper.dylib

      - name: Upload dylib and installation notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-iOS-arm64-${{ github.run_number }}
          path: build/ios/
          if-no-files-found: error
          retention-days: 30

      - name: Verify floating GUI in iOS Simulator
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p build/ios-ui-tests
          bash ios/gui-test.sh 2>&1 | tee build/ios-ui-tests/gui-test.log

      - name: Upload GUI probe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-GUI-probe-${{ github.run_number }}
          path: |
            build/ios-ui-tests/*.png
            build/ios-ui-tests/*.json
            build/ios-ui-tests/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          metadata = json.loads(Path('build/ios/build-info.json').read_text())
          print('Built **PADCheaper.dylib** for arm64 iPhoneOS, minimum iOS 15.0.')
          print()
          print('Download the run artifact, then re-sign with LiveContainer before loading.')
          print('A draggable **PC** button opens the six-slot body/weapon formation editor, search, PADDashFormation import/export and live mode/source/multi filters.')
          print('The artifact starts in diagnostic mode. Protocol, save-state, battle guard/session and simulator UI checks passed.')
          print('The user reported working GUI/Skin/BGM on iOS 27 with custom LiveContainer in 0.2.0-gui. Save/restart and account isolation still require device testing; see device-testing.md.')
          print('Battle replacement uses six independent native parameter leases, individual/all restore, and guarded failure recovery. Actual gameplay, resource loading and server settlement require device verification.')
          print('The user reported badge unlock working in 0.3.0-battle. Badge save/restart and account boundary cases still need device verification. Timer automation changes flags only; exit popup continuation requires the panel button and device verification.')
          print('0.3.2-battle fixes phase-2 input waiting by reading the native raw/frame touch records, handles consumed release events, and reports phase/input/drag/read gates separately. Input decoder and reader regressions are included.')
          print('All entry modes are allowed by default, with source 0 / multi 0 defaults. GUI/config edits take effect without recompilation. Banked multi 1/4 still requires a separate team adapter.')
          print()
          print('SHA-256: `' + metadata['sha256'] + '`')
          PY
