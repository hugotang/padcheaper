name: Build iOS LiveContainer dylib

on:
  # Accumulate features first. Dispatch only when the user requests a build/test.
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: ios-dylib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # Tests take ~14 min and the GUI step may use its own 20 min limit.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show iOS SDK toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang

      - name: Validate target and run protocol tests
        run: |
          python3 ios/tools/generate_target.py
          python3 ios/tools/generate_battle.py
          bash ios/test.sh

      - name: Compile arm64 iPhoneOS dylib
        run: bash ios/build.sh

      - name: Verify editor save and mobile interactions
        run: |
          npm install --prefix build/editor-ui-deps --no-audit --no-fund playwright@1.64.1
          node build/editor-ui-deps/node_modules/playwright/cli.js install chromium
          PH_PLAYWRIGHT_MODULE="$PWD/build/editor-ui-deps/node_modules/playwright" node ios/tests/editor_ui_tests.js

      - name: Upload editor browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-Editor-browser-${{ github.run_number }}
          path: |
            build/editor-browser/*.png
            build/team-model/test-result.json
            build/team-model/dungeon-test-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Inspect Mach-O and signature
        run: |
          file build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -hv build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -l build/ios/PADCheaper.dylib
          codesign --verify --strict build/ios/PADCheaper.dylib
          shasum -a 256 build/ios/PADCheaper.dylib

      - name: Upload dylib and installation notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-iOS-arm64-${{ github.run_number }}
          path: build/ios/
          if-no-files-found: error
          retention-days: 30

      - name: Verify floating GUI in iOS Simulator
        # Four iPhone launches (~9 min) plus one iPad boot and launch.
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p build/ios-ui-tests
          bash ios/gui-test.sh 2>&1 | tee build/ios-ui-tests/gui-test.log

      - name: Upload GUI probe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-GUI-probe-${{ github.run_number }}
          path: |
            build/ios-ui-tests/*.png
            build/ios-ui-tests/*.json
            build/ios-ui-tests/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          metadata = json.loads(Path('build/ios/build-info.json').read_text())
          print('Built **PADCheaper.dylib** for arm64 iPhoneOS, minimum iOS 15.0.')
          print()
          print('Download the run artifact and replace the dylib through the existing Dopamine rootless injection setup. LiveContainer users must re-sign there before loading.')
          print('Version **' + metadata['dylib_version'] + '** includes a mobile team overview and member sheet, 64 saved teams, full-slot swap/copy, undo, recent cards and pinch zoom.')
          print('Formation saves require a matching native success receipt. Real disk-write failure preserves the editor draft and the previously selected automatic entry team.')
          print('0.5.32: solo spinner fishing. When the normal search and the 2 s retry miss a goal on a board with exactly one unlocked spinner and no thorns, the route may enter that spinner once to take out a goal colour in its colour table: it holds beside the cell until the colour shows with at least 6 frames left, budgets one full colour cycle and stops at 4 s plus that cycle. Native input opens only that cell, never in multiplayer.')
          print('0.5.31: removes the 0.5.30 spinner phase pinning, whose freeze-at-grab premise was wrong and could waste a turn. Keeps the 2 s solo search retry. Spinner cells can be crossed only when every orb on the board is locked.')
          print('0.5.30: solo boards retry a failed search for 2 s (the solo move timer starts at the grab), then fall back to pinning one spinner phase: spinners freeze at the grab, so the route waits for that colour, grabs, verifies it and releases without moving on a mismatch.')
          print('0.5.29: solo opening resumes when Auto first starts after a manual transform (later unready opening skills are skipped); 8P Auto keeps running after peer disconnects (reads the departed seat like 4P); optional always-on 8P auto-start after the countdown (once per match); orb input works after relaunching into a suspended dungeon (no login parse required for orbs).')
          print('0.5.28: exact shapes (T/L/cross/3x3) follow the actual removed group like the heart four (PAD 0x1005F7954): an unmarked same-colour neighbour no longer voids the shape; border-separator pre-reject removed. Solo opening resumes after a manual transform when the enemy delayed the transform skill.')
          print('0.5.27: activity scoreTurn makes the B6 waiting turn score rows/links/Combo when the next-turn pair converts every colour to fire/dark (next turn still checks absorption and CD); cup weights follow the calibrated score (Combo 700, row 1800, link 4200, step 35), only B3 keeps the 3:1 damage ranking. Readable disabled Once shortcut; 8P hides solo-only orb cards. Reimport the activity JSON (requires 0.5.27).')
          print('0.5.26: floating controls become a 48 pt bubble (expand/collapse, Stop while busy) plus a fixed-order capsule: Once, Auto/Stop, settings gear (disabled while busy, never stops), collapse; capsule gaps pass touches through. PC settings grouped into five cards with system colors. 8P state grouped by lifetime with a pure C inventory model and tests. CI adds an 11-inch iPad GUI run. CHANGELOG added.')
          print('0.5.25: a preferred B6 reserve turn that finds no qualifying route falls back to the guide output instead of stopping, and is not retried with a smaller budget on that turn; it gets half the floor budget. Attack-row candidates split the remaining time between two colors. Exact solver speedups (same-color swaps reuse the parent score, allocation-free duplicate table, early stop when no longer route can win) keep identical routes. Orb page: status, preview and an 8P progress summary first, section cards, SF Symbols, phase-colored status, one-row landscape actions, collapsible help, copy diagnostics, guarded editor sheets; haptics on Once/Auto/Stop.')
          print('0.5.24: guide B5 prioritizes Ney then Sonia before standalone fallbacks, preserving later conversions when possible. B6 can prefer one bounded reserve turn when next-turn pair supply is strictly better than current supply; already-ready conversions run directly. Verified skill effects restart skipped rescue branches without replaying attempted slots; first and latest blocked evidence is retained. Feasible activity output can explore up to two missing attack-color rows using only the original remaining budget, with unchanged release goals. Reimport the activity JSON. Relative ranking improvements are not a damage, survival or win guarantee.')
          print('0.5.23: the opt-in cup guide can prepare once on B6 when current output and ready skills fail. A bounded three-orb, single-Combo route preserves known orbs for native conversions ready by the next turn; fresh absorption and CD checks precede the saved skill sequence. Stop/Auto retains the used preparation. Activity ranking weights fire/dark 3:1 with rows, Combo and one member-wide link contribution; dark links remain valid. 8P Once counts first removal, and the first blocked board/CD evidence survives later stops. Reimport the activity JSON to adopt these settings. This is a specific cup recipe and relative ranking, not a general survival or damage model.')
          print('0.5.22: saved default-off GameWith floor-skill option runs native openers before the first puzzle, even on already-solvable boards; conditional B5 Ney and separate Sonia slots, B5 standalone slot1/2 recovery, B6 fresh conversion/rescue without an unsupported stall. Confirmed guide prefixes and completed alternatives survive Stop/Auto and preference changes. B1 compares first-removal Combo then erased orbs before steps, preserving baseline candidates and adding diversity within the original deadline/path limit. First B1 release evidence and native stop conditions are retained. Updated activity JSON must be reimported. No exact damage, kill or device-stability guarantee.')
          print('0.5.21: 8P ordinary fixed skills acknowledge the native root, catalog owner, visible slot, body source and one new global use; type-268 limited-use member counters may remain zero. Same-match Stop/Auto retains confirmed progress and late native completion, replans the current board and does not replay uncertain skills. Fixed in-match effects and cooldowns are independent of ordinary catalog skills. Native/Session and real Session/UI pause/resume regressions cover B2/B5 symptoms. Cold-start readiness and clear/result stop remain; 3/4P stay explicit once. Device synchronization and exact scoring remain unverified.')
          print('0.5.18: offline solo formation model compares current/final forms, HP/RCV, leader/awakening and active-skill shields, and no-skyfall heart-heal estimates. Unohana HP/RCV x3, Haschwalth five-turn shield, Byakuya HP x1.5, expiry and same-category replacement are explicit; HP capacity does not heal. One-tap Dungeon Compare carries the retained capture in memory to the selected team; JSON import, all-floor damage/capacity scenarios, unknown branches and importable guide JSON with separate atomic storage, restart reload and dated GameWith Lv5 preparation notes are available. New dungeons and notes do not require a dylib rebuild. Complete body/super-sync/assist/latent icons and common resistances are available offline. Unknown conditions and ambiguous transforms are explicit. Scenario controls never persist or apply the formation, and do not authorize Auto survival relaxation. PADDashFormation icon sources and GPL-3.0 notice are included.')
          print('0.5.17: all-floor JSON export captures this entry\'s loaded spawns, catalog variants, action definitions and bounded live observations from stable solo windows; retained after exit, with explicit partial data and a system file share sheet. No unspawned alternatives or future AI are claimed. Continuous Combo countermeasures require first-removal counts above the highest lower-absorption threshold plus current debits, unless fresh active bypass is confirmed. Upper absorption stops. Skills run first; base and assist goals stay required; evidence changes revoke input. No positive bonus, cascade, skyfall or survival credit; L/heart-only and three-light/three-heart defense remain unavailable.')
          print('Reviewed 3P solo continuation accepts the retained local board after native cleanup, using the native move timer. The transition cancels old gesture intent and still requires a fresh explicit tap. Incomplete recovery, invalid ownership/timing and resolution remain blocked. Retains 4P to 3P entry reset and verified remote-exit handling.')
          print('Spinner shape search reuses bounded layout scores and guides hard-shape goals without requiring thorns; exact goals, all shared phases and the original time/path budgets remain enforced. Dense shape conflicts use a necessary separator bound. Battle core protection no longer requires unused allocation-tail pages; actually used modal pointers are checked separately.')
          print('Opt-in ordinary solo assistRecoveryL preserves every original goal and required skill, adds enough currently supported L groups, rechecks before input and confirms duration zero on the next stable turn. Uryu templates enable the option on reimport. Conditional enemy action, selector, dispatch and damage diagnostics do not authorize survival-based deferral, early cleanse or L/heart-only stalling.')
          print('Fixed-team leader variants use the total allocated catalog bounds and dedicated skill facts. 4P extra helpers have only active skills. Manual goals remain editable after a leader-read failure, and copied goals come from the latest snapshot. Readiness history retains synchronization substeps and the affected departure seat without recording peer identity.')
          print('Multiplayer leader goals use the current native leader/helper skills, including linked fixed-team variants. Missing or unsupported skills disable the plan; a verified 4P extra-skill helper contributes no helper leader clauses. Source changes cancel stale planning/input. This checks board conditions only, not HP, skill-use count or full activation.')
          print('Explicit 3/4/8-player local once uses fresh native ownership/view/clock checks, one armed began and token-bound release. Co-op turn ownership and independent versus boards are tested separately. 8P current-match Auto is an explicit extension with its own fixed-source checks. Team replacement, BGM, timer writes, packet edits and 3/4P continuous mode remain disabled; modes 7/10/11 cannot become solo when the selector resets.')
          print('Transient skill-window closure waits at most three seconds without consuming opening/once/group progress, then rechecks before activation and first touch. Persistent restrictions and changed context still stop.')
          print('The independent CIEL x Euphyllis single-Kenpachi plan uses Unohana in slot 5, seven confirmed opening skills and mandatory 6-1-2 supply every puzzle. Unohana becomes ready at puzzle 6 under ordinary charge assumptions; Kenpachi responds only to required absorption rescue. Reimport the new template to adopt it. Existing Uryu and CIEL plans remain available.')
          print('Optional default-off diagonal movement shares one policy across search, replay and native acknowledgement. Matching remains horizontal/vertical. Profile and team-plan settings save atomically.')
          print('The optional first-wave heart-four policy now accepts both poison and mortal poison only when every shared spinner phase has that heart four; all bombs must still clear first wave. Conservative thorn HP checks, opening resize, native same-family body/assist selection, team persistence and named BGM behavior remain. No full healing, damage or seamless-skill guarantee is made.')
          print('The exact source passed protocol/model/solver, macOS native/session/rules/config/profile, browser and Scene/legacy initial/restart GUI suites, arm64 compilation and strict ad-hoc signature verification. The artifact retains device_verified=false: real PAD skill effects, diagonal acceptance and multiplayer synchronization still require device testing.')
          print('The artifact starts in diagnostic mode; automatic entry is disabled by default. Both existing Dopamine rootless and LiveContainer loading workflows are retained.')
          print()
          print('SHA-256: `' + metadata['sha256'] + '`')
          PY
