name: Build iOS LiveContainer dylib

on:
  # Accumulate features first. Dispatch only when the user requests a build/test.
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel
      solver_only:
        description: Compile the standalone arm64 solver and run the portable model tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-dylib-${{ github.workflow }}-${{ github.ref }}${{ inputs.solver_only && '-solver-only' || '' }}
  cancel-in-progress: true

jobs:
  solver:
    if: ${{ inputs.solver_only }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compile standalone iPhoneOS arm64 solver
        run: |
          set -eu
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          minimum=$(python3 ios/tools/release_metadata.py minimum-ios)
          flags=(-arch arm64 -isysroot "$sdk" "-miphoneos-version-min=$minimum" -O2 -Wall -Wextra -Werror -Iios/src)
          objects=()
          for model in PHOrbModel PHBattleModel PHInputModel; do
            xcrun --sdk iphoneos clang "${flags[@]}" -std=gnu11 -c "ios/src/$model.c" -o "$RUNNER_TEMP/$model.o"
            objects+=("$RUNNER_TEMP/$model.o")
          done
          xcrun --sdk iphoneos clang++ "${flags[@]}" -std=c++17 -c ios/src/PHOrbSolver.cpp -o "$RUNNER_TEMP/PHOrbSolver.o"
          xcrun libtool -static -o "$RUNNER_TEMP/libOrbSolver.a" "$RUNNER_TEMP/PHOrbSolver.o" "${objects[@]}"
          xcrun lipo "$RUNNER_TEMP/libOrbSolver.a" -verify_arch arm64

      - name: Run portable solver and model regressions
        run: |
          set -o pipefail
          BUILD_DIR="$RUNNER_TEMP/orb-model-tests" bash ios/tools/windows-tests.sh | tee "$RUNNER_TEMP/solver-regression.log"

      - name: Test the planner with simulated boards and input
        run: |
          set -o pipefail
          BUILD_DIR="$RUNNER_TEMP/orb-model-tests" bash ios/tools/test-solver-session.sh | tee "$RUNNER_TEMP/session-regression.log"

      - name: Collect standalone solver and test results
        run: |
          mkdir -p build/standalone-solver/include build/standalone-solver/pazusoba
          cp "$RUNNER_TEMP/libOrbSolver.a" "$RUNNER_TEMP/solver-regression.log" "$RUNNER_TEMP/session-regression.log" build/standalone-solver/
          cp ios/src/{PHOrbSolver,PHOrbAttackQuality,PHOrbSearchAttempt,PHOrbModel,PHBattleModel,PHInputModel,PHBattlePreset,PHBattlePolicy,PHBattleMemberState}.h build/standalone-solver/include/
          cp LICENSE build/standalone-solver/
          cp ios/third_party/pazusoba/{LICENSE,NOTICE.md} build/standalone-solver/pazusoba/
          git rev-parse HEAD > build/standalone-solver/source-commit.txt
          cd build/standalone-solver
          shasum -a 256 libOrbSolver.a include/*.h LICENSE pazusoba/* *-regression.log source-commit.txt > SHA256SUMS

      - name: Upload standalone archive and headers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-OrbSolver-iOS-arm64-${{ github.run_number }}
          path: build/standalone-solver/
          if-no-files-found: error
          retention-days: 30

  build:
    if: ${{ !inputs.solver_only }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # Tests take ~14 min and the GUI step may use its own 20 min limit.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show iOS SDK toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang

      - name: Validate target and run protocol tests
        run: |
          python3 ios/tools/generate_target.py
          python3 ios/tools/generate_battle.py
          bash ios/test.sh

      - name: Compile arm64 iPhoneOS dylib
        run: bash ios/build.sh

      - name: Verify editor save and mobile interactions
        run: |
          npm install --prefix build/editor-ui-deps --no-audit --no-fund playwright@1.64.1
          node build/editor-ui-deps/node_modules/playwright/cli.js install chromium
          PH_PLAYWRIGHT_MODULE="$PWD/build/editor-ui-deps/node_modules/playwright" node ios/tests/editor_ui_tests.js

      - name: Upload editor browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-Editor-browser-${{ github.run_number }}
          path: |
            build/editor-browser/*.png
            build/team-model/test-result.json
            build/team-model/dungeon-test-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Inspect Mach-O and signature
        run: |
          file build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -hv build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -l build/ios/PADCheaper.dylib
          codesign --verify --strict build/ios/PADCheaper.dylib
          shasum -a 256 build/ios/PADCheaper.dylib

      - name: Upload dylib and installation notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-iOS-arm64-${{ github.run_number }}
          path: build/ios/
          if-no-files-found: error
          retention-days: 30

      - name: Verify floating GUI in iOS Simulator
        # Four iPhone launches (~9 min). The iPad run was dropped on 2026-11-05
        # at the user's request after recurring failures; cause still unconfirmed.
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p build/ios-ui-tests
          bash ios/gui-test.sh 2>&1 | tee build/ios-ui-tests/gui-test.log

      - name: Upload GUI probe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-GUI-probe-${{ github.run_number }}
          path: |
            build/ios-ui-tests/*.png
            build/ios-ui-tests/*.json
            build/ios-ui-tests/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build summary
        run: python3 ios/tools/release_metadata.py summary build/ios >> "$GITHUB_STEP_SUMMARY"
