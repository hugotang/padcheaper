name: Build iOS LiveContainer dylib

on:
  # Accumulate features first. Dispatch only when the user requests a build/test.
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: ios-dylib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show iOS SDK toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang

      - name: Validate target and run protocol tests
        run: |
          python3 ios/tools/generate_target.py
          python3 ios/tools/generate_battle.py
          bash ios/test.sh

      - name: Compile arm64 iPhoneOS dylib
        run: bash ios/build.sh

      - name: Verify editor save and mobile interactions
        run: |
          npm install --prefix build/editor-ui-deps --no-audit --no-fund playwright@1.64.1
          node build/editor-ui-deps/node_modules/playwright/cli.js install chromium
          PH_PLAYWRIGHT_MODULE="$PWD/build/editor-ui-deps/node_modules/playwright" node ios/tests/editor_ui_tests.js

      - name: Upload editor browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-Editor-browser-${{ github.run_number }}
          path: build/editor-browser/*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Inspect Mach-O and signature
        run: |
          file build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -hv build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -l build/ios/PADCheaper.dylib
          codesign --verify --strict build/ios/PADCheaper.dylib
          shasum -a 256 build/ios/PADCheaper.dylib

      - name: Upload dylib and installation notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-iOS-arm64-${{ github.run_number }}
          path: build/ios/
          if-no-files-found: error
          retention-days: 30

      - name: Verify floating GUI in iOS Simulator
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p build/ios-ui-tests
          bash ios/gui-test.sh 2>&1 | tee build/ios-ui-tests/gui-test.log

      - name: Upload GUI probe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-GUI-probe-${{ github.run_number }}
          path: |
            build/ios-ui-tests/*.png
            build/ios-ui-tests/*.json
            build/ios-ui-tests/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          metadata = json.loads(Path('build/ios/build-info.json').read_text())
          print('Built **PADCheaper.dylib** for arm64 iPhoneOS, minimum iOS 15.0.')
          print()
          print('Download the run artifact and replace the dylib through the existing Dopamine rootless injection setup. LiveContainer users must re-sign there before loading.')
          print('Version **' + metadata['dylib_version'] + '** includes a mobile team overview and member sheet, 64 saved teams, full-slot swap/copy, undo, recent cards and pinch zoom.')
          print('Formation saves require a matching native success receipt. Real disk-write failure preserves the editor draft and the previously selected automatic entry team.')
          print('0.5.11: optional per-strategy normal poison with first-wave heart four; all shared spinner phases require an exact straight four when any poison clears. Goals and Combo precede accepted normal poison count. Mortal poison remains forbidden and every bomb still clears in the first wave. User-confirmed team recovery is not a healing/damage calculation. Recorded desktop comparisons add one Combo on three solved poison boards; native release checks use the same captured policy. Failed shape searches no longer blame harmless leftover poison.')
          print('0.5.10: spinner/thorn shape search keeps intermediate repairs until their heart four is complete, focuses the costly exact shape and uses bitset runs/groups/gravity. Final HP, pending damage, first-wave heart and all-phase goals remain mandatory. Desktop comparisons recover one recorded miss; low-HP reachability, dense-heart conflicts and genuine shortages remain limited. No timed spinner capture or diagonal execution is enabled.')
          print('Retains 0.5.9 native opening resize interpolation and native team-BGM name matching. The user confirmed opening 6/6 and actual BGM playback; new solver fixes still need iPhone verification. The same dylib retains both Dopamine rootless and LiveContainer loading workflows.')
          print('Native same-family base/assist selection retains all readiness conditions. Optional thorn Combo priority and a zero-contact search pass share the original deadline and survival checks. AutoCombo and clear_dungeon reports are read-only research; no settlement rewrite or replacement revival.')
          print('Applied labels compare the immutable accepted body/assist/training recipe; switching or editing a team cannot inherit another recipe’s status.')
          print('Automatic orbs: single-player 6x5/7x6/5x4, saved quality and board goals, explicit continuous start for the current battle or execute-once/stop. Up to 12 ordered skill rules use member, turn interval, floor, orb shortage and enemy absorb/void conditions through guarded native skill activation. Unmet goals or uncertain state stop the run. This does not evaluate complete leader activation or damage. The user reported the 0.5.0 6x5 baseline passed; newer features still need device verification.')
          print('Single-player automatic entry retains initial Skill Boost, effective current HP initialization and native team refresh.')
          print('Orb strategies add six rotating skill groups, battle-once rules, slot-wide floor reservations and 64 team/dungeon profiles matched only at explicit start. Cloud/blind/weak/locked/nail/combo effects are read, tape/fixed-start constrain the route, and native unmatchable/minimum-removal rules apply. Thorn contacts require verified HP above pending plus route damage and a first-wave heart four, without crediting healing or resistance. Stored spinner positions are validated before clipping to resized boards; visible spinners are avoided and every shared phase must meet goals and hazard rules. Poison matches are default-forbidden with an explicit normal-poison/heart-four team option; mortal matches and first-wave leftover bombs always block execution. Device verification remains pending.')
          print('Restore comparisons ignore native assist padding and unused skill bytes when no assist exists. Failed positions retain individual reasons and can be retried before another team is applied. Uncertain native mutations block the original battle until an observed exit or a validated different battle.')
          print('Refused skills retain attempt-time board/member context and can explain native minimum-color conditions. Rules may select any of several unmatchable colors while other conditions remain conjunctive. Background transitions preserve an existing stop reason.')
          print('Exact first-wave fours use actual removed groups, allowing unmarked same-color neighbors while still rejecting five-orb and merged groups. Joint shape guidance and diverse candidates retain the existing bounded quality settings. Unmet-goal messages include missing conditions and actual search time; screenshot and regression fixtures do not replace real-device validation.')
          print('Spinner-aware stable shape hints, a missing-goal recovery pass and up to two discarded-frontier revisits share the original search deadline. Exact all-phase goals, conservative T borders and path limits remain in force. Native temporary transformations preserve completed team-plan openings, pause incompatible actor skills and retain required rescue checks; leader-mode goals read current leaders.')
          print('Multiplayer battle writes are disabled: every nonzero multi value and mode 7 are blocked independently of configuration. Detection remains latched until leaving battle.')
          print('Multiplayer probes decode metadata without native getters/digest. Apply, transform, entry, restore, rebind and timer writes are refused; pending work is discarded without native cleanup.')
          print('Existing local rebind and bank-selection code was removed after the user reported different teams on peer devices, missing derived values and disconnects. The exact server reason is unverified.')
          print('Single-player entry uses the first eligible completed frame; constructor-generated board dimensions and opening board are not regenerated.')
          print('The artifact starts in diagnostic mode; automatic entry is disabled by default. Mode/source filters remain editable; legacy allowAllMulti cannot enable multiplayer writes.')
          print('Protocol, save-state, native battle/session, failure recovery and simulator GUI checks passed. Native tests assert zero multiplayer calls/writes, stale-snapshot and rollback rejection, and retained single-player SB/HP behavior.')
          print('The user confirmed single-player automatic entry/SB in 0.4.1. Earlier host replacement was only a local display observation. New HP, actual skill effects and settlement still need device verification; CI does not run real multiplayer PAD.')
          print()
          print('SHA-256: `' + metadata['sha256'] + '`')
          PY
