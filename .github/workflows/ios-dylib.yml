name: Build iOS LiveContainer dylib

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'ios/**'
      - '.github/workflows/ios-dylib.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-dylib.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: ios-dylib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show iOS SDK toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang

      - name: Validate target and run protocol tests
        run: |
          python3 ios/tools/generate_target.py
          python3 ios/tools/generate_battle.py
          bash ios/test.sh

      - name: Compile arm64 iPhoneOS dylib
        run: bash ios/build.sh

      - name: Inspect Mach-O and signature
        run: |
          file build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -hv build/ios/PADCheaper.dylib
          xcrun --sdk iphoneos otool -l build/ios/PADCheaper.dylib
          codesign --verify --strict build/ios/PADCheaper.dylib
          shasum -a 256 build/ios/PADCheaper.dylib

      - name: Upload dylib and installation notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-iOS-arm64-${{ github.run_number }}
          path: build/ios/
          if-no-files-found: error
          retention-days: 30

      - name: Verify floating GUI in iOS Simulator
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p build/ios-ui-tests
          bash ios/gui-test.sh 2>&1 | tee build/ios-ui-tests/gui-test.log

      - name: Upload GUI probe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PADCheaper-GUI-probe-${{ github.run_number }}
          path: |
            build/ios-ui-tests/*.png
            build/ios-ui-tests/*.json
            build/ios-ui-tests/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          metadata = json.loads(Path('build/ios/build-info.json').read_text())
          print('Built **PADCheaper.dylib** for arm64 iPhoneOS, minimum iOS 15.0.')
          print()
          print('Download the run artifact, then re-sign with LiveContainer before loading.')
          print('Version **' + metadata['dylib_version'] + '** includes a six-slot body/weapon editor and a library of up to 64 saved teams, with named awakenings and input focus zoom fixes.')
          print('Optional automatic entry applies the selected saved team during a fresh dungeon opening, recomputes initial Skill Boost and initializes only the local effective HP using native dungeon rules.')
          print('Multi 1/4 use a validated bank adapter. Leases track each source team across switches; offscreen restores wait until their team is visible.')
          print('Mode 7 / multi 1 recognizes phase-46 entry sync, selects only the local network seat, restores the original view in the same frame, and requires local turn ownership for manual operations.')
          print('Owned multiplayer entry bindings are monitored every frame. After peer synchronization, existing profiles rebind atomically on the first eligible local operation turn, retaining synchronized HP/forms/charges without a new SB pass, HP refill or allocation.')
          print('Existing native refresh updates derived team values and move time. Constructor-generated board dimensions and opening board are not regenerated; see entry-derived-state.md for the timing boundary.')
          print('The artifact starts in diagnostic mode; automatic entry is disabled by default. All entry modes are allowed by default, with source 0 / multi 0 defaults. GUI/config edits take effect without recompilation.')
          print('Protocol, save-state, native battle/session, failure recovery and simulator GUI checks passed. GUI checks include legacy draft migration, library management, focus scale, process restart and scene/legacy guest windows.')
          print('GUI, cosmetics, badges, replacement, single-player automatic entry/SB and 0.4.2 host automatic replacement were user-reported working. Guest rebind recovery and server settlement still require device verification; see device-testing.md.')
          print()
          print('SHA-256: `' + metadata['sha256'] + '`')
          PY
