<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://mapaler.github.io data:; connect-src 'none'">
<title>PADCheaper 編隊</title>
<style>
:root{color-scheme:dark;--bg:#0e161b;--surface:#18252d;--line:#30434e;--text:#f2f6f5;--muted:#afc0c8;--green:#86e2b8;--gold:#edcc87;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}button,input,select{font:inherit}button,summary{touch-action:manipulation;cursor:pointer}button{border:1px solid var(--line);border-radius:11px;color:var(--text);background:var(--surface);min-height:44px;padding:10px 12px}button:disabled{opacity:.42;cursor:default}button.primary{background:var(--green);color:#12231d;border-color:var(--green);font-weight:700}button.active{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}button:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}input,select{font-size:16px;width:100%;min-height:44px;background:#0e1a20;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.wrap{max-width:850px;margin:auto;padding:16px 12px calc(115px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:10px;margin-bottom:16px}.mark{width:40px;height:40px;display:grid;place-items:center;background:#254739;color:var(--green);border-radius:12px;font-weight:800}.heading{flex:1}.heading strong{font-size:20px}.eyebrow{font-size:10px;color:var(--green);letter-spacing:1.5px}#close{font-size:13px}.quiet{color:var(--muted);font-size:13px;line-height:1.6}.library-row{display:flex;gap:8px;align-items:end}.library-select{flex:1;min-width:0}.management{position:relative}.management>summary{list-style:none;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--surface);font-size:14px}.management>summary::-webkit-details-marker{display:none}.menu{position:absolute;z-index:4;right:0;top:52px;width:min(290px,80vw);padding:12px;border:1px solid var(--line);border-radius:14px;background:#1c2c35;box-shadow:0 12px 32px #0008}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu .quiet{margin:0 0 10px}.menu .full{grid-column:1/-1}.team-title{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;font-size:19px;font-weight:650;background:transparent;margin-top:6px}.status-row{display:flex;gap:8px;align-items:start;margin-top:10px}.status-dot{width:7px;height:7px;margin-top:6px;background:var(--green);border-radius:50%;flex:none}.status-row[data-tone=dirty] .status-dot{background:var(--gold)}.status-row[data-tone=error] .status-dot{background:#ffb9a4}#save-status{font-size:13px}#entry-state{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.6}.overview-head{display:flex;align-items:center;gap:8px;margin:16px 0 8px}.overview-head strong{flex:1;font-size:15px}.overview-head button{font-size:13px}.sheet{border:1px solid var(--line);border-radius:15px;padding:10px 7px 12px;background:linear-gradient(145deg,#192a30,#142027);overflow-x:auto}.row-title{font-size:12px;color:var(--muted);margin:9px 3px 7px}.row-title.weapon{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:3px}.position{text-align:center;font-size:11px;color:var(--muted);white-space:nowrap}.card{padding:3px;min-width:0;background:#101d23;border:1px solid #2f444e;border-radius:8px;position:relative;text-align:center;overflow:hidden}.card.assist{border-top:2px solid #b9934d}.card.active{border-color:var(--green)}.portrait{position:relative;width:100%;aspect-ratio:1;border-radius:5px;background-color:#233740;background-size:1000% 1000%;background-repeat:no-repeat;display:grid;place-items:center;color:#8ba2ac;font-size:22px}.portrait.empty:after{content:'+'}.card .number{font-size:11px;margin-top:4px;color:#d3e3e8;font-variant-numeric:tabular-nums;white-space:nowrap}.card .name{display:none}.card .stats{font-size:11px;color:var(--green);line-height:16px;white-space:pre-line}.card .leased{position:absolute;right:3px;top:3px;border-radius:4px;background:#86e2b8;color:#12231d;font-size:11px;padding:1px 4px}.card .leased.other{background:#3c4c55;color:#fff}.battle-summary{margin-top:12px;font-size:14px}details.battle-details{margin-top:8px;border:1px solid var(--line);border-radius:11px;padding:0 12px}details.battle-details>summary{padding:12px 0;font-size:13px;color:var(--muted)}.connection{font-size:13px;line-height:1.65;overflow-wrap:anywhere;padding-bottom:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}.metric{padding:10px;background:#132329;border-radius:9px}.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:20px;margin-top:4px}.notice{padding:11px 12px;margin-top:10px;border-radius:10px;background:#263f34;color:#e2fff0;font-size:13px;line-height:1.6}.error{color:#ffb9a4;font-size:13px;line-height:1.6;margin:10px 0;overflow-wrap:anywhere}.confirm{padding:12px;margin:10px 0;background:#29343a;border:1px solid var(--line);border-radius:10px}.toolbar{display:flex;gap:8px;margin-top:10px}.toolbar button{flex:1}.footer{position:fixed;z-index:3;bottom:0;left:0;right:0;background:#0e161bf5;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.footer-inner{max-width:826px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer .quiet{grid-column:1/-1;font-size:12px;text-align:center}.credits{margin-top:16px;color:#91a6b0;font-size:12px;line-height:1.7}
body.editing{overflow:hidden}body.editing #main{visibility:hidden}.editor-dialog{position:fixed;z-index:10;left:0;right:0;top:var(--editor-top,0px);display:flex;align-items:flex-end;justify-content:center;height:var(--editor-height,100%);padding-top:12px;background:#0008}.editor-panel{width:100%;max-width:760px;height:100%;max-height:900px;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;background:var(--bg);box-shadow:0 -10px 40px #0005}.editor-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}.editor-head strong{flex:1;font-size:17px}.editor-head button{font-size:13px}.editor-content{overflow-y:auto;overscroll-behavior:contain;padding:14px 14px calc(22px + env(safe-area-inset-bottom))}.editor-navigation{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}.editor-navigation>button{font-size:22px;padding:4px}.editor-navigation .kind-tabs{margin:0}.editor-navigation .kind-tabs button{font-size:14px}.pill{font-size:13px;padding:4px 7px;color:var(--green);white-space:nowrap}.kind-tabs{display:flex;gap:7px;margin:12px 0}.kind-tabs button{flex:1}.selected-name{font-size:17px;font-weight:650;margin:14px 0 6px;overflow-wrap:anywhere}.search-bar{display:flex;gap:7px;margin-top:14px}.search-bar input{min-width:0}.search-bar button{flex:none;font-size:14px}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:265px;overflow:auto;padding:8px 1px}.result{display:flex;align-items:center;text-align:left;gap:7px;padding:7px;font-size:12px;line-height:1.5}.result .portrait{width:38px;min-width:38px}.result span{min-width:0;overflow-wrap:anywhere}.recent{display:flex;gap:8px;overflow-x:auto;padding:8px 1px}.recent button{width:66px;min-width:66px;padding:5px;font-size:11px}.recent .portrait{margin-bottom:4px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.fieldline{display:flex;gap:5px}.fieldline input{min-width:0}.fieldline button{font-size:13px;padding:8px;flex:none}.wide{grid-column:1/-1}.plus-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{font-size:13px;min-height:44px;padding:8px 10px}.section-label{color:var(--muted);font-size:13px;margin:15px 0 8px}.latent-line{display:flex;align-items:center;gap:7px}.latent-line select{flex:1;min-width:0}.latent-line button{flex:none}.latent-list{margin-top:8px}.latent-list button{color:var(--gold)}.slot-tools{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}.slot-tools summary{padding:9px 0;color:var(--muted);font-size:14px}.slot-tools select{margin:8px 0 0}.editor-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.editor-actions .wide{font-size:13px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:600px){.wrap{padding:24px 24px 135px}.grid{gap:9px}.sheet{padding:12px}.card{padding:6px}.card .name{display:block;font-size:12px;height:34px;line-height:17px;overflow:hidden;margin-top:3px}.card .number,.card .stats,.position{font-size:12px}.results{grid-template-columns:repeat(3,minmax(0,1fr))}.fields{grid-template-columns:repeat(4,minmax(0,1fr))}.editor-content{padding-left:24px;padding-right:24px}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .12s,border-color .12s}}
</style></head><body>
<main class="wrap" id="main">
<header><div class="mark">PC</div><div class="heading"><div class="eyebrow">PAD CHEAPER</div><strong>隊伍編成</strong></div><button id="close">儲存並關閉</button></header>
<div class="library-row"><div class="library-select"><label for="team-choice">正在編輯</label><select id="team-choice" aria-label="選取隊伍"></select></div><details class="management" id="management"><summary>管理</summary><div class="menu"><div class="quiet" id="library-count"></div><div class="menu-grid"><button id="team-new">新增空白隊伍</button><button id="team-copy">另存新隊</button><button id="import">貼上隊伍</button><button id="export">複製分享連結</button><button id="reference">開啟 PADDash</button><button id="team-delete">刪除隊伍</button><button id="discard-close" class="full">不儲存並關閉</button></div></div></details></div>
<input class="team-title" id="team-title" maxlength="80" aria-label="隊伍名稱" value="我的隊伍">
<div class="status-row" id="save-status-row"><span class="status-dot" aria-hidden="true"></span><span id="save-status" role="status">正在讀取隊伍…</span></div>
<div id="entry-state"></div>
<div id="delete-confirm" class="confirm" hidden><span id="delete-message"></span><div class="toolbar"><button id="delete-yes">確定刪除</button><button id="delete-cancel">取消</button></div></div>
<div id="discard-confirm" class="confirm" hidden>關閉後會捨棄未儲存的變更。<div class="toolbar"><button id="discard-yes">捨棄並關閉</button><button id="discard-cancel">繼續編輯</button></div></div>
<div id="error" class="error" role="alert" hidden></div><div id="toast" class="notice" role="status" hidden></div>
<div class="overview-head"><strong>六人隊伍</strong><button id="undo" disabled>撤銷上一步</button></div>
<section class="sheet" aria-label="六人隊伍總覽"><div id="positions" class="grid"></div><div class="row-title">本體 · 點擊編輯</div><div id="body-grid" class="grid"></div><div class="row-title weapon">武裝</div><div id="assist-grid" class="grid"></div></section>
<div class="battle-summary" id="battle-summary" role="status"></div>
<details class="battle-details" id="battle-details"><summary>本場狀態與操作</summary><div class="metrics"><div class="metric"><small>入場 SB · 原生計算</small><strong id="entry-sb">—</strong></div><div class="metric"><small>目前 HP · 遊戲讀回</small><strong id="current-hp">—</strong></div></div><div id="connection" class="connection"></div><button id="restore-all">全部還原／取消排程</button><p class="quiet">手動套用保留目前充能；新入場自動套用才會初始化 SB 與 HP。</p></details>
<div class="credits">本體與武裝可一起換位或複製。分享格式相容 PADDashFormation；頭像需連線，搜尋與編輯可離線使用。保留雙指縮放。</div>
<div class="footer"><div class="footer-inner"><button id="save" class="primary">儲存隊伍</button><button id="apply-all">套用整隊</button><div class="quiet" id="apply-hint">儲存後用於下次單人入場</div></div></div>
</main>
<section id="editor-dialog" class="editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editor-title" hidden>
<div class="editor-panel"><div class="editor-head"><strong id="editor-title">位置 1</strong><button id="editor-undo" disabled>撤銷</button><button id="editor-done">返回隊伍</button></div>
<div class="editor-navigation"><button id="previous-slot" aria-label="上一格">‹</button><div class="kind-tabs" role="group" aria-label="編輯本體或武裝"><button id="kind-body" aria-pressed="true">本體</button><button id="kind-assist" aria-pressed="false">武裝</button></div><button id="next-slot" aria-label="下一格">›</button><span class="sr-only" id="slots-label">1 / 6</span></div>
<div class="editor-content" id="editor-content">
<div id="editor-error" class="error" role="alert" hidden></div><div id="editor-notice" class="notice" role="status" hidden></div>
<div class="selected-name" id="selected-name">尚未選擇角色</div><div class="quiet" id="selected-hint"></div>
<div class="search-bar"><input id="search" type="search" placeholder="圖鑑編號或角色名稱" aria-label="搜尋角色" autocomplete="off"><button id="search-toggle">搜尋</button></div><div id="results" class="results" hidden></div>
<div id="recent-section" hidden><div class="section-label">最近使用</div><div id="recent" class="recent"></div></div>
<div class="fields"><div><label for="level">等級</label><div class="fieldline"><input id="level" type="number" min="1" max="120" inputmode="numeric"><button id="max-level">滿級</button></div></div><div><label for="skill">技能等級</label><div class="fieldline"><input id="skill" type="number" min="1" max="999" inputmode="numeric"><button id="max-skill">滿技</button></div></div><div><label for="awakenings">普通覺醒</label><select id="awakenings"></select></div><div><label for="plus-preset">加值</label><select id="plus-preset"></select></div>
<div class="wide" id="plus-detail"><div class="plus-fields"><div><label for="hp-plus">HP</label><input id="hp-plus" type="number" min="0" max="297" inputmode="numeric"></div><div><label for="atk-plus">攻擊</label><input id="atk-plus" type="number" min="0" max="297" inputmode="numeric"></div><div><label for="rcv-plus">回復</label><input id="rcv-plus" type="number" min="0" max="297" inputmode="numeric"></div></div></div></div>
<div id="super-section"><div class="section-label">超覺醒 · 選擇一項</div><div id="super-options" class="chips"></div></div>
<div id="latent-section"><div class="section-label" id="latent-title">潛在覺醒</div><div class="latent-line"><select id="latent-choice" aria-label="新增潛覺"></select><button id="latent-add">新增</button></div><div id="latent-list" class="chips latent-list"></div></div>
<details class="slot-tools"><summary>換位、複製與移除</summary><label for="slot-destination">目標位置（包含本體與武裝）</label><select id="slot-destination"></select><div class="toolbar"><button id="swap-slot">交換位置</button><button id="copy-slot">複製整格</button></div><div class="toolbar"><button id="clear-card">移除此本體</button></div></details>
<div class="editor-actions"><button id="apply-one">套用本格</button><button id="restore-one">還原本格</button><div class="quiet wide" id="slot-state"></div></div>
</div></div></section>
<script>/*__FORMATION_MODEL__*/</script><script>const PH_CATALOG = /*__CATALOG__*/;</script><script>/*__EDITOR_UI__*/</script></body></html>
