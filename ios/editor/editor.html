<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://mapaler.github.io data:; connect-src 'none'">
<title>PADCheaper 編隊</title>
<style>
:root{color-scheme:dark;--bg:#0e161b;--surface:#18252d;--line:#30434e;--text:#f2f6f5;--muted:#a4b5bd;--green:#86e2b8;--gold:#edcc87;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;border:1px solid var(--line);border-radius:10px;color:var(--text);background:var(--surface);min-height:42px;padding:9px 12px}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--green);color:#12231d;border-color:var(--green);font-weight:700}button.active{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}input,select{width:100%;min-height:43px;background:#0e1a20;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px}input:focus{outline:2px solid var(--green);outline-offset:1px}
.wrap{max-width:850px;margin:auto;padding:18px 14px calc(24px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;margin-bottom:19px}.mark{width:40px;height:40px;display:grid;place-items:center;background:#254739;color:var(--green);border-radius:12px;font-weight:800}.heading{flex:1}.eyebrow{font-size:10px;color:var(--green);letter-spacing:1.5px}.heading strong{font-size:20px;display:block;margin-top:3px}.quiet{color:var(--muted);font-size:12px;line-height:1.6}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.toolbar button{flex:1;padding:8px;white-space:nowrap;font-size:12px}.team-title{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:5px 0;font-size:18px;font-weight:600;background:transparent}
.sheet{border:1px solid var(--line);border-radius:15px;padding:13px 9px;margin:15px 0;background:linear-gradient(145deg,#192a30,#142027)}.row-title{font-size:10px;letter-spacing:2px;color:var(--muted);margin:9px 3px 7px}.row-title.weapon{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.position{text-align:center;font-size:10px;color:var(--muted);padding:0 0 7px}.card{padding:3px;min-width:0;background:#101d23;border:1px solid #2f444e;border-radius:9px;overflow:hidden;position:relative}.card.assist{border-top:2px solid #b9934d}.card.active{border-color:var(--green)}.portrait{position:relative;width:100%;aspect-ratio:1;border-radius:5px;background-color:#233740;background-size:1000% 1000%;background-repeat:no-repeat;display:grid;place-items:center;color:#78909b;font-size:22px}.portrait.empty:after{content:'+'}.card .number{font-size:9px;margin-top:4px;color:#d3e3e8;font-variant-numeric:tabular-nums}.card .name{font-size:9px;height:26px;line-height:13px;overflow:hidden;margin-top:2px;overflow-wrap:anywhere}.card .stats{font-size:8px;color:var(--green);line-height:13px;white-space:nowrap}.card .leased{position:absolute;right:3px;top:3px;border-radius:4px;background:#86e2b8;color:#12231d;font-size:8px;padding:1px 3px}.connection{padding:10px 12px;background:#17272a;border-radius:9px;font-size:12px;line-height:1.55;overflow-wrap:anywhere}
.editor{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.editor-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.editor-head strong{flex:1;font-size:16px}.pill{font-size:10px;padding:4px 7px;border-radius:5px;background:#2c3b38;color:var(--green)}.selected-name{font-size:15px;margin:12px 0 6px;overflow-wrap:anywhere}.search-bar{display:flex;gap:7px;margin-top:12px}.search-bar button{flex:none}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:290px;overflow:auto;padding:8px 1px}.results[hidden]{display:none}.result{display:flex;align-items:center;text-align:left;gap:7px;padding:6px;font-size:10px;line-height:1.5}.result .portrait{width:34px;min-width:34px}.result span{min-width:0;overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.fieldline{display:flex;gap:5px}.fieldline button{font-size:11px;padding:8px;min-width:42px}.wide{grid-column:1/-1}.plus-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{font-size:11px;min-height:37px;padding:7px 9px}.section-label{color:var(--muted);font-size:11px;margin:14px 0 8px}.latent-line{display:flex;align-items:center;gap:7px}.latent-line select{flex:1}.latent-line button{flex:none}.latent-list{margin-top:8px}.latent-list button{color:var(--gold)}.error{color:#ffb9a4;min-height:20px;font-size:12px;line-height:1.5;margin-top:9px}.footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.footer .primary{grid-column:1/-1}.footer .small{font-size:12px}.credits{border-top:1px solid var(--line);padding-top:13px;margin-top:20px;font-size:10px;color:#8198a3;line-height:1.7}.toast{position:fixed;z-index:5;bottom:calc(20px + env(safe-area-inset-bottom));left:16px;right:16px;padding:14px;border-radius:12px;background:#315342;color:#f2fff8;box-shadow:0 4px 30px #0008;max-width:600px;margin:auto;font-size:13px;line-height:1.5}.toast[hidden]{display:none}
@media(min-width:600px){.wrap{padding:25px 30px}.grid{gap:11px}.card{padding:6px}.card .number,.card .name{font-size:12px}.card .name{height:32px;line-height:16px}.card .stats{font-size:11px}.position{font-size:12px}.results{grid-template-columns:repeat(4,1fr)}.result{font-size:12px}.result .portrait{width:45px;min-width:45px}.fields{grid-template-columns:repeat(4,1fr)}.wide{grid-column:1/-1}}
</style></head><body><main class="wrap">
<header><div class="mark">PC</div><div class="heading"><div class="eyebrow">PAD CHEAPER</div><strong>隊伍編成</strong></div><button id="close">完成</button></header>
<input class="team-title" id="team-title" maxlength="80" aria-label="隊伍名稱" value="我的隊伍">
<div class="toolbar"><button id="import">貼上隊伍</button><button id="export">複製分享連結</button><button id="reference">開啟 PADDash</button></div>
<div class="quiet">選擇本體與武裝，逐格調整。編輯只改草稿，按套用才會替換戰鬥隊員。</div>
<section class="sheet" aria-label="六人隊伍總覽"><div id="positions" class="grid"></div><div class="row-title weapon">武裝 · ASSIST</div><div id="assist-grid" class="grid"></div><div class="row-title">本體 · MEMBER</div><div id="body-grid" class="grid"></div></section>
<div id="connection" class="connection" role="status">等待戰鬥檢查；現在可以編輯隊伍。</div>
<section class="editor"><div class="editor-head"><strong id="editor-title">位置 1 · 本體</strong><span class="pill" id="slots-label">1 / 6</span><button id="clear-card">移除</button></div>
<div class="search-bar"><input id="search" type="search" placeholder="輸入圖鑑編號或角色名稱" aria-label="搜尋角色" autocomplete="off"><button id="search-toggle">選擇角色</button></div><div id="results" class="results" hidden></div>
<div class="selected-name" id="selected-name">尚未選擇角色</div><div class="quiet" id="selected-hint">本體預設滿級、滿覺醒、+891；武裝預設 SLv.1、滿覺醒、+297。</div>
<div class="fields"><div><label for="level">等級 · 0 為滿級</label><div class="fieldline"><input id="level" type="number" min="0" max="120" inputmode="numeric"><button id="max-level">滿級</button></div></div><div><label for="skill">技能等級 · 0 為滿技</label><div class="fieldline"><input id="skill" type="number" min="0" max="999" inputmode="numeric"><button id="max-skill">滿技</button></div></div><div><label for="awakenings">普通覺醒</label><select id="awakenings"></select></div><div><label for="plus-preset">加值</label><select id="plus-preset"></select></div>
<div class="wide" id="plus-detail"><div class="plus-fields"><div><label for="hp-plus">HP</label><input id="hp-plus" type="number" min="0" max="297" inputmode="numeric"></div><div><label for="atk-plus">攻擊</label><input id="atk-plus" type="number" min="0" max="297" inputmode="numeric"></div><div><label for="rcv-plus">回復</label><input id="rcv-plus" type="number" min="0" max="297" inputmode="numeric"></div></div></div></div>
<div id="super-section"><div class="section-label">超覺醒 · 選擇一項</div><div id="super-options" class="chips"></div></div>
<div id="latent-section"><div class="section-label" id="latent-title">潛在覺醒</div><div class="latent-line"><select id="latent-choice" aria-label="新增潛覺"></select><button id="latent-add">新增</button></div><div id="latent-list" class="chips latent-list"></div></div>
<div id="error" class="error" role="alert"></div></section>
<div class="footer"><button id="apply-all" class="primary">套用整隊</button><button id="apply-one">套用本格</button><button id="save">儲存草稿</button><button id="restore-one" class="small">還原本格</button><button id="restore-all" class="small">全部還原／取消</button></div>
<div class="credits">日服圖鑑資料參照 PADDashFormation。頭像需連線載入；編隊、搜尋及匯入可離線使用。實際可用等級與覺醒會再由遊戲資料檢查。</div>
</main><div id="toast" class="toast" role="status" hidden></div>
<script>/*__FORMATION_MODEL__*/</script><script>const PH_CATALOG = /*__CATALOG__*/;</script><script>/*__EDITOR_UI__*/</script></body></html>
